# Stateless workers claim jobs from the database, so they scale independently
# of web traffic. Run at least one replica for webhooks, reminders and
# recurring invoices.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerline-worker
  namespace: ledgerline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledgerline-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledgerline-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/ledgerline/app:1.0.0
          command: ["node", "dist/server.js"]
          envFrom:
            - configMapRef:
                name: ledgerline-config
            - secretRef:
                name: ledgerline-secrets
          env:
            - name: WORKER_MODE
              value: standalone
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
