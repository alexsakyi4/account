apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledgerline-default-deny
  namespace: ledgerline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledgerline
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
